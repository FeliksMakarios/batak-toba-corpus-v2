name: Validasi CoNLL-U

on:
  push:
    paths: ["corpus/**", "anotasi-ud/**", "scripts/**"]
  pull_request:
    paths: ["corpus/**", "anotasi-ud/**", "scripts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validasi format CoNLL-U
        # Templat kosong (*template*, *blank*) sengaja belum berisi HEAD dan DEPREL,
        # sehingga tidak ikut divalidasi.
        run: |
          mapfile -t files < <(find corpus anotasi-ud -name '*.conllu' ! -name '*template*' ! -name '*blank*' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Belum ada file .conllu berisi anotasi, lewati."
            exit 0
          fi
          python scripts/validate_conllu.py "${files[@]}"
